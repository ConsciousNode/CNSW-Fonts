<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src blob: data:;">
<title>CNSW Font Forge</title>
<style>
/* Authorship: ConsciousNode SoftWorks (MIT License) — Forge UI stylesheet */
:root {
  --bg: #0f1216;
  --panel: #171c23;
  --border: #2a323d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --ink: #f0f6fc;
  --shadow: #6e7681;
  --cell-bg: #0b0e12;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px;
  line-height: 1.45;
}
h1, h2, h3 { margin: 0 0 10px 0; font-weight: 600; }
h1 { font-size: 18px; }
h2 { font-size: 15px; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-top: 20px; }
h3 { font-size: 13px; color: var(--muted); }
.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 12px 14px;
  border-radius: 6px;
  margin-bottom: 16px;
}
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
button, .file-label {
  background: #21262d;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 10px;
  font: inherit;
  cursor: pointer;
}
button:hover, .file-label:hover { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
select, input[type="text"] {
  background: #0d1117;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 8px;
  font: inherit;
}
.layout {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 16px;
  align-items: start;
}
@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; }
}
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px;
}
.editor-grid {
  display: inline-grid;
  gap: 2px;
  background: var(--border);
  padding: 2px;
  border-radius: 4px;
  margin: 10px 0;
}
.cell-btn {
  width: 28px;
  height: 28px;
  padding: 0;
  border: none;
  border-radius: 2px;
  background: var(--cell-bg);
  color: var(--muted);
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cell-btn.ink { background: var(--ink); color: #0f1216; font-weight: 700; }
.cell-btn.shadow { background: var(--shadow); color: #0f1216; }
.cell-btn.readonly { cursor: default; opacity: 0.75; }
.cell-btn.guide-col { outline: 1px dashed #3b4452; }
.glyph-picker {
  display: grid;
  grid-template-columns: repeat(16, 1fr);
  gap: 3px;
  margin-top: 8px;
}
.glyph-pick-btn {
  padding: 3px 0;
  font-size: 11px;
  text-align: center;
}
.glyph-pick-btn.active {
  border-color: var(--accent);
  background: #1f334d;
}
.specimen-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px;
  margin-bottom: 16px;
}
.scale-block { margin: 10px 0; }
canvas.pixel-canvas {
  display: block;
  image-rendering: pixelated;
  background: #0b0e12;
  border: 1px solid var(--border);
  margin-top: 4px;
}
.status-line { color: var(--muted); font-size: 12px; margin-top: 6px; }
.hidden-input { display: none; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>CNSW Font Forge</h1>
    <div class="status-line" id="status-line">Ready.</div>
  </div>
  <div class="btn-row">
    <label class="file-label">Import JSON <input type="file" id="import-json" accept=".json" class="hidden-input"></label>
    <button id="export-json">Export cnsw-fonts.json</button>
    <button id="export-sans-hex">Sans .hex</button>
    <button id="export-serif-hex">Serif .hex</button>
    <button id="export-thes-asm">Thesuramos .tryte.asm</button>
    <button id="export-all-ttf">Export 4 .ttf</button>
    <button id="export-all-woff">Export 4 .woff</button>
    <button id="verify-reader">Verify via Independent Reader</button>
  </div>
</div>

<div class="layout">
  <div class="panel">
    <h2>Glyph Editor</h2>
    <div class="btn-row">
      <select id="editor-font">
        <option value="sans">ConsciousNode Sans (8x8)</option>
        <option value="serif">CNSW Serif (8x16)</option>
        <option value="thesuramos">Times New Thesuramos (9x9)</option>
      </select>
      <button id="editor-undo" disabled>Undo</button>
    </div>
    <div class="status-line" id="editor-glyph-info">Code 65 ('A')</div>
    <div id="editor-grid" class="editor-grid"></div>
    <h3>Live Running Text Preview (2x)</h3>
    <input type="text" id="live-text-input" value="Sphinx of black quartz, judge my vow! O0 Il1| S5 B8 Z2" style="width:100%; margin-bottom:6px;">
    <canvas id="live-preview-canvas" class="pixel-canvas"></canvas>
    <h3>Glyph Picker (ASCII 32..127)</h3>
    <div id="glyph-picker" class="glyph-picker"></div>
  </div>

  <div id="specimens-container"></div>
</div>

    let sum = 0;
    const end = start + length;
    for (let p = start; p < end; p += 4) {
      const b0 = p < end ? u8[p] : 0;
      const b1 = p + 1 < end ? u8[p + 1] : 0;
      const b2 = p + 2 < end ? u8[p + 2] : 0;
      const b3 = p + 3 < end ? u8[p + 3] : 0;
      sum = (sum + (((b0 << 24) | (b1 << 16) | (b2 << 8) | b3) >>> 0)) >>> 0;
    }
    return sum;
  }

  async function decompressWoffToSfnt(woffBytes, inflateFn) {
    if (readTag(woffBytes, 0) !== 'wOFF') {
      throw new Error('Not a WOFF 1.0 file');
    }
    const flavor = readU32(woffBytes, 4);
    const numTables = readU16(woffBytes, 12);
    const entries = [];
    for (let i = 0; i < numTables; i++) {
      const base = 44 + i * 20;
      const tag = readTag(woffBytes, base);
      const offset = readU32(woffBytes, base + 4);
      const compLength = readU32(woffBytes, base + 8);
      const origLength = readU32(woffBytes, base + 12);
      const origChecksum = readU32(woffBytes, base + 16);
      const slice = woffBytes.slice(offset, offset + compLength);
      const raw = compLength === origLength ? slice : await inflateFn(slice);
      if (raw.length !== origLength) {
        throw new Error(`WOFF table ${tag} length mismatch: got ${raw.length}, expected ${origLength}`);
      }
      entries.push({ tag, origChecksum, origLength, raw });
    }

    const headerLen = 12 + numTables * 16;
    let totalLen = headerLen;
    for (const e of entries) {
      e.sfntOffset = totalLen;
      totalLen += Math.ceil(e.origLength / 4) * 4;
    }
    const sfnt = new Uint8Array(totalLen);
    // Write sfnt header
    sfnt[0] = (flavor >>> 24) & 0xff;
    sfnt[1] = (flavor >>> 16) & 0xff;
    sfnt[2] = (flavor >>> 8) & 0xff;
    sfnt[3] = flavor & 0xff;
    sfnt[4] = (numTables >>> 8) & 0xff;
    sfnt[5] = numTables & 0xff;
    const entrySel = Math.floor(Math.log2(numTables));
    const searchR = Math.pow(2, entrySel) * 16;
    const rangeS = numTables * 16 - searchR;
    sfnt[6] = (searchR >>> 8) & 0xff; sfnt[7] = searchR & 0xff;
    sfnt[8] = (entrySel >>> 8) & 0xff; sfnt[9] = entrySel & 0xff;
    sfnt[10] = (rangeS >>> 8) & 0xff; sfnt[11] = rangeS & 0xff;

    for (let i = 0; i < numTables; i++) {
      const e = entries[i];
      const rec = 12 + i * 16;
      for (let k = 0; k < 4; k++) sfnt[rec + k] = e.tag.charCodeAt(k);
      const vals = [e.origChecksum, e.sfntOffset, e.origLength];
      for (let v = 0; v < 3; v++) {
        const x = vals[v];
        sfnt[rec + 4 + v * 4] = (x >>> 24) & 0xff;
        sfnt[rec + 5 + v * 4] = (x >>> 16) & 0xff;
        sfnt[rec + 6 + v * 4] = (x >>> 8) & 0xff;
        sfnt[rec + 7 + v * 4] = x & 0xff;
      }
      sfnt.set(e.raw, e.sfntOffset);
    }
    return sfnt;
  }

  function parseSfnt(sfnt) {
    const sfntVersion = readU32(sfnt, 0);
    if (sfntVersion !== 0x00010000) {
      throw new Error(`Unsupported sfnt version: 0x${sfntVersion.toString(16)}`);
    }
    const numTables = readU16(sfnt, 4);
    const tables = {};
    const checksumErrors = [];

    for (let i = 0; i < numTables; i++) {
      const rec = 12 + i * 16;
      const tag = readTag(sfnt, rec);
      const checksum = readU32(sfnt, rec + 4);
      const offset = readU32(sfnt, rec + 8);
      const length = readU32(sfnt, rec + 12);
      tables[tag] = { tag, checksum, offset, length };

      let computed = sumWords(sfnt, offset, length);
      if (tag === 'head') {
        // Subtract checkSumAdjustment field (at offset + 8)
        const adj = readU32(sfnt, offset + 8);
        computed = (computed - adj) >>> 0;
      }
      if (computed !== checksum) {
        checksumErrors.push(`${tag}: expected 0x${checksum.toString(16)}, got 0x${computed.toString(16)}`);
      }
    }

    const wholeSum = sumWords(sfnt, 0, sfnt.length);
    const checkSumAdjustmentValid = wholeSum === 0xB1B0AFBA;

    // Parse head
    const headOff = tables.head.offset;
    const head = {
      unitsPerEm: readU16(sfnt, headOff + 18),
      xMin: readI16(sfnt, headOff + 36),
      yMin: readI16(sfnt, headOff + 38),
      xMax: readI16(sfnt, headOff + 40),
      yMax: readI16(sfnt, headOff + 42),
      indexToLocFormat: readI16(sfnt, headOff + 50),
    };

    // Parse hhea
    const hheaOff = tables.hhea.offset;
    const hhea = {
      ascent: readI16(sfnt, hheaOff + 4),
      descent: readI16(sfnt, hheaOff + 6),
      lineGap: readI16(sfnt, hheaOff + 8),
      advanceWidthMax: readU16(sfnt, hheaOff + 10),
      numberOfHMetrics: readU16(sfnt, hheaOff + 34),
    };

    // Parse maxp
    const maxpOff = tables.maxp.offset;
    const maxp = {
      numGlyphs: readU16(sfnt, maxpOff + 4),
    };

    // Parse hmtx
    const hmtxOff = tables.hmtx.offset;
    const advances = [];
    for (let g = 0; g < maxp.numGlyphs; g++) {
      if (g < hhea.numberOfHMetrics) {
        advances.push(readU16(sfnt, hmtxOff + g * 4));
      } else {
        advances.push(advances[hhea.numberOfHMetrics - 1]);
      }
    }

    // Parse cmap (find format 4 subtable)
    const cmapOff = tables.cmap.offset;
    const cmapCount = readU16(sfnt, cmapOff + 2);
    let subOff = -1;
    for (let i = 0; i < cmapCount; i++) {
      const rOff = cmapOff + 4 + i * 8;
      const plat = readU16(sfnt, rOff);
      const enc = readU16(sfnt, rOff + 2);
      const rel = readU32(sfnt, rOff + 4);
      if ((plat === 3 && enc === 1) || (plat === 0 && enc === 3)) {
        subOff = cmapOff + rel;
        break;
      }
    }
    const cmapMap = new Map();
    if (subOff !== -1 && readU16(sfnt, subOff) === 4) {
      const segCount = readU16(sfnt, subOff + 6) / 2;
      const endCodesOff = subOff + 14;
      const startCodesOff = endCodesOff + segCount * 2 + 2;
      const idDeltaOff = startCodesOff + segCount * 2;
      const idRangeOff = idDeltaOff + segCount * 2;
      for (let s = 0; s < segCount; s++) {
        const endC = readU16(sfnt, endCodesOff + s * 2);
        const startC = readU16(sfnt, startCodesOff + s * 2);
        const delta = readI16(sfnt, idDeltaOff + s * 2);
        const range = readU16(sfnt, idRangeOff + s * 2);
        if (startC === 0xFFFF && endC === 0xFFFF) continue;
        for (let code = startC; code <= endC; code++) {
          let gid = 0;
          if (range === 0) {
            gid = (code + delta) & 0xffff;
          } else {
            const addr = idRangeOff + s * 2 + range + (code - startC) * 2;
            const gVal = readU16(sfnt, addr);
            gid = gVal === 0 ? 0 : ((gVal + delta) & 0xffff);
          }
          cmapMap.set(code, gid);
        }
      }
    }

    // Parse loca
    const locaOff = tables.loca.offset;
    const glyphOffsets = [];
    for (let g = 0; g <= maxp.numGlyphs; g++) {
      if (head.indexToLocFormat === 1) {
        glyphOffsets.push(readU32(sfnt, locaOff + g * 4));
      } else {
        glyphOffsets.push(readU16(sfnt, locaOff + g * 2) * 2);
      }
    }

    // Parse glyf contours
    const glyfBase = tables.glyf.offset;
    const glyphs = [];
    for (let g = 0; g < maxp.numGlyphs; g++) {
      const start = glyphOffsets[g];
      const end = glyphOffsets[g + 1];
      if (start === end) {
        glyphs.push({ contours: [] });
        continue;
      }
      const p = glyfBase + start;
      const numContours = readI16(sfnt, p);
      if (numContours <= 0) {
        glyphs.push({ contours: [] });
        continue;
      }
      const endPts = [];
      for (let c = 0; c < numContours; c++) {
        endPts.push(readU16(sfnt, p + 10 + c * 2));
      }
      const totalPts = endPts[numContours - 1] + 1;
      const instrLen = readU16(sfnt, p + 10 + numContours * 2);
      let cur = p + 12 + numContours * 2 + instrLen;

      const flags = [];
      while (flags.length < totalPts) {
        const f = sfnt[cur++];
        flags.push(f);
        if (f & 0x08) {
          const rep = sfnt[cur++];
          for (let r = 0; r < rep; r++) flags.push(f);
        }
      }

      const xs = new Array(totalPts);
      let x = 0;
      for (let i = 0; i < totalPts; i++) {
        const f = flags[i];
        if (f & 0x02) {
          const dx = sfnt[cur++];
          x += (f & 0x10) ? dx : -dx;
        } else if (!(f & 0x10)) {
          x += readI16(sfnt, cur);
          cur += 2;
        }
        xs[i] = x;
      }

      const ys = new Array(totalPts);
      let y = 0;
      for (let i = 0; i < totalPts; i++) {
        const f = flags[i];
        if (f & 0x04) {
          const dy = sfnt[cur++];
          y += (f & 0x20) ? dy : -dy;
        } else if (!(f & 0x20)) {
          y += readI16(sfnt, cur);
          cur += 2;
        }
        ys[i] = y;
      }

      const contours = [];
      let prevEnd = -1;
      for (let c = 0; c < numContours; c++) {
        const cPts = [];
        for (let i = prevEnd + 1; i <= endPts[c]; i++) {
          cPts.push([xs[i], ys[i]]);
        }
        contours.push(cPts);
        prevEnd = endPts[c];
      }
      glyphs.push({ contours });
    }

    return {
      tables: Object.keys(tables),
      checksumErrors,
      checkSumAdjustmentValid,
      wholeSum,
      head,
      hhea,
      maxp,
      advances,
      cmapMap,
      glyphs,
    };
  }

  function signedArea(pts) {
    let a = 0;
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const [x1, y1] = pts[i];
      const [x2, y2] = pts[(i + 1) % n];
      a += x1 * y2 - x2 * y1;
    }
    return a * 0.5;
  }

  function pointInContour(px, py, pts) {
    let inside = false;
    const n = pts.length;
    for (let i = 0, j = n - 1; i < n; j = i++) {
      const [xi, yi] = pts[i];
      const [xj, yj] = pts[j];
      if (((yi > py) !== (yj > py)) && (px < ((xj - xi) * (py - yi)) / (yj - yi) + xi)) {
        inside = !inside;
      }
    }
    return inside;
  }

  function segmentsIntersectProper(a, b, c, d) {
    function orient(p, q, r) {
      return (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]);
    }
    const o1 = orient(a, b, c);
    const o2 = orient(a, b, d);
    const o3 = orient(c, d, a);
    const o4 = orient(c, d, b);
    return (o1 > 0 && o2 < 0 || o1 < 0 && o2 > 0) && (o3 > 0 && o4 < 0 || o3 < 0 && o4 > 0);
  }

  function validateContours(contours) {
    const issues = [];
    for (let ci = 0; ci < contours.length; ci++) {
      const pts = contours[ci];
      if (pts.length < 3) {
        issues.push(`Contour ${ci} has < 3 points`);
        continue;
      }
      const area = signedArea(pts);
      if (area === 0) {
        issues.push(`Contour ${ci} has zero area`);
        continue;
      }
      // Check self-intersection
      const n = pts.length;
      for (let i = 0; i < n; i++) {
        const a = pts[i];
        const b = pts[(i + 1) % n];
        for (let j = i + 2; j < n; j++) {
          if (i === 0 && j === n - 1) continue;
          const c = pts[j];
          const d = pts[(j + 1) % n];
          if (segmentsIntersectProper(a, b, c, d)) {
            issues.push(`Contour ${ci} self-intersects at edges ${i} and ${j}`);
          }
        }
      }
      // Check winding: test an interior midpoint slightly shifted or a vertex/edge midpoint
      // Use midpoint of edge 0 nudged slightly or test another contour's point
      let depth = 0;
      const testX = (pts[0][0] + pts[1][0]) * 0.5;
      const testY = (pts[0][1] + pts[1][1]) * 0.5;
      for (let cj = 0; cj < contours.length; cj++) {
        if (cj === ci) continue;
        if (pointInContour(testX, testY, contours[cj])) depth++;
      }
      const expectedCW = depth % 2 === 0;
      const isCW = area < 0;
      if (expectedCW !== isCW) {
        issues.push(`Contour ${ci} wrong winding (depth=${depth}, area=${area})`);
      }
    }
    return issues;
  }

  // Rasterize a glyph's contours at pixel centers using point-in-polygon (even-odd rule)
  function rasterizeGlyph(contours, width, height, pixelUnits, baselineRow) {
    const yTop = (baselineRow + 1) * pixelUnits;
    const rows = [];
    for (let r = 0; r < height; r++) {
      const py = yTop - (r + 0.5) * pixelUnits;
      let line = '';
      for (let c = 0; c < width; c++) {
        const px = (c + 0.5) * pixelUnits;
        let inside = false;
        for (const pts of contours) {
          if (pointInContour(px, py, pts)) inside = !inside;
        }
        line += inside ? '#' : '.';
      }
      rows.push(line);
    }
    return rows;
  }

  return {
    decompressWoffToSfnt,
    parseSfnt,
    validateContours,
    rasterizeGlyph,
  };
});
</script>

<script>
(function () {
  'use strict';

  const codec = window.CNSWFontCodec;
  const reader = window.CNSWTtfRead;

  let fontData = JSON.parse(document.getElementById('cnsw-initial-fonts').textContent);
  let currentFontId = 'sans';
  let currentCode = 65;
  const undoStack = [];

  const statusEl = document.getElementById('status-line');
  const fontSelect = document.getElementById('editor-font');
  const undoBtn = document.getElementById('editor-undo');
  const glyphInfoEl = document.getElementById('editor-glyph-info');
  const gridEl = document.getElementById('editor-grid');
  const pickerEl = document.getElementById('glyph-picker');
  const liveInput = document.getElementById('live-text-input');
  const liveCanvas = document.getElementById('live-preview-canvas');
  const specimensEl = document.getElementById('specimens-container');

  function setStatus(msg) {
    statusEl.textContent = msg;
  }

  async function browserDeflate(u8) {
    const cs = new CompressionStream('deflate');
    const writer = cs.writable.getWriter();
    writer.write(u8);
    writer.close();
    const buf = await new Response(cs.readable).arrayBuffer();
    return new Uint8Array(buf);
  }

  async function browserInflate(u8) {
    const ds = new DecompressionStream('deflate');
    const writer = ds.writable.getWriter();
    writer.write(u8);
    writer.close();
    const buf = await new Response(ds.readable).arrayBuffer();
    return new Uint8Array(buf);
  }

  function downloadBytes(filename, bytes, mime) {
    const blob = new Blob([bytes], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function drawGlyphOnCtx(ctx, font, code, x0, y0, scale) {
    const rows = font.glyphs[String(code)] || font.glyphs['32'];
    for (let r = 0; r < font.height; r++) {
      const row = rows[r];
      for (let c = 0; c < font.width; c++) {
        const ch = row[c];
        if (ch === '#' || ch === '+') {
          ctx.fillStyle = '#f0f6fc';
          ctx.fillRect(x0 + c * scale, y0 + r * scale, scale, scale);
        } else if (ch === '-') {
          ctx.fillStyle = '#6e7681';
          ctx.fillRect(x0 + c * scale, y0 + r * scale, scale, scale);
        }
      }
    }
  }

  function renderTextToCanvas(canvas, font, text, scale) {
    const cols = Math.max(1, text.length);
    canvas.width = cols * font.width * scale + 8;
    canvas.height = font.height * scale + 8;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0b0e12';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < text.length; i++) {
      const code = text.charCodeAt(i);
      const validCode = code >= 32 && code <= 127 ? code : 32;
      drawGlyphOnCtx(ctx, font, validCode, 4 + i * font.width * scale, 4, scale);
    }
  }

  function renderSpecimenGrid(canvas, font, scale) {
    const cols = 16;
    const rows = 6; // 96 glyphs
    const pad = 2;
    const cellW = font.width * scale + pad;
    const cellH = font.height * scale + pad;
    canvas.width = cols * cellW + pad;
    canvas.height = rows * cellH + pad;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0b0e12';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < 96; i++) {
      const gx = i % cols;
      const gy = Math.floor(i / cols);
      drawGlyphOnCtx(ctx, font, 32 + i, pad + gx * cellW, pad + gy * cellH, scale);
    }
  }

  function renderSpecimens() {
    specimensEl.innerHTML = '';
    const order = ['sans', 'serif', 'thesuramos'];
    for (const id of order) {
      const font = fontData.fonts[id];
      const card = document.createElement('div');
      card.className = 'specimen-card';
      card.setAttribute('data-font-card', id);

      const h2 = document.createElement('h2');
      h2.textContent = font.name + ' (' + font.width + 'x' + font.height + ', ' + font.type + ')';
      card.appendChild(h2);

      const mInfo = document.createElement('div');
      mInfo.className = 'status-line';
      const m = font.metrics;
      mInfo.textContent = 'Metrics: capTopRow=' + m.capTopRow + ', xTopRow=' + m.xTopRow + ', baselineRow=' + m.baselineRow + ', descenderRow=' + m.descenderRow;
      card.appendChild(mInfo);

      for (const scale of [1, 2, 4]) {
        const blk = document.createElement('div');
        blk.className = 'scale-block';
        const lbl = document.createElement('h3');
        lbl.textContent = 'Full Glyph Grid (' + scale + 'x)';
        blk.appendChild(lbl);
        const cv = document.createElement('canvas');
        cv.className = 'pixel-canvas';
        cv.setAttribute('data-specimen', id + '-' + scale + 'x');
        renderSpecimenGrid(cv, font, scale);
        blk.appendChild(cv);
        card.appendChild(blk);
      }

      const pBlk = document.createElement('div');
      pBlk.className = 'scale-block';
      const pLbl = document.createElement('h3');
      pLbl.textContent = 'Pangram & Confusables (2x)';
      pBlk.appendChild(pLbl);
      const pCv = document.createElement('canvas');
      pCv.className = 'pixel-canvas';
      renderTextToCanvas(pCv, font, 'The quick brown fox jumps over a lazy dog. 0123456789', 2);
      pBlk.appendChild(pCv);

      const cCv = document.createElement('canvas');
      cCv.className = 'pixel-canvas';
      renderTextToCanvas(cCv, font, 'O0 Il1| S5 B8 Z2 rn m  !?@#$%&*+-=/:;.,', 2);
      pBlk.appendChild(cCv);
      card.appendChild(pBlk);

      specimensEl.appendChild(card);
    }
  }

  function renderPicker() {
    pickerEl.innerHTML = '';
    for (let code = 32; code <= 127; code++) {
      const btn = document.createElement('button');
      btn.className = 'glyph-pick-btn' + (code === currentCode ? ' active' : '');
      btn.textContent = code === 32 ? 'SP' : (code === 127 ? 'DEL' : String.fromCharCode(code));
      btn.title = 'ASCII ' + code;
      btn.setAttribute('data-pick-code', String(code));
      btn.addEventListener('click', () => {
        currentCode = code;
        renderEditor();
        renderPicker();
      });
      pickerEl.appendChild(btn);
    }
  }

  function renderEditor() {
    const font = fontData.fonts[currentFontId];
    const rows = font.glyphs[String(currentCode)];
    const label = currentCode === 127 ? 'DEL' : String.fromCharCode(currentCode);
    glyphInfoEl.textContent = font.name + ' — Code ' + currentCode + " ('" + label + "')";

    gridEl.style.gridTemplateColumns = 'repeat(' + font.width + ', 28px)';
    gridEl.innerHTML = '';
    for (let r = 0; r < font.height; r++) {
      for (let c = 0; c < font.width; c++) {
        const ch = rows[r][c];
        const btn = document.createElement('button');
        btn.className = 'cell-btn';
        btn.setAttribute('data-row', String(r));
        btn.setAttribute('data-col', String(c));
        if (ch === '#' || ch === '+') {
          btn.classList.add('ink');
          btn.textContent = ch;
        } else if (ch === '-') {
          btn.classList.add('shadow');
          btn.textContent = '-';
        }
        const isTernaryShadowZone = font.type === 'ternary' && (r === 8 || c === 8);
        if (isTernaryShadowZone) {
          btn.classList.add('readonly');
          btn.disabled = true;
        } else {
          btn.addEventListener('click', () => toggleCell(r, c));
        }
        gridEl.appendChild(btn);
      }
    }
    undoBtn.disabled = undoStack.length === 0;
    renderTextToCanvas(liveCanvas, font, liveInput.value, 2);
  }

  function toggleCell(r, c) {
    const font = fontData.fonts[currentFontId];
    const key = String(currentCode);
    const prevRows = font.glyphs[key].slice();
    undoStack.push({ fontId: currentFontId, code: currentCode, rows: prevRows });

    if (font.type === 'binary') {
      const row = prevRows[r].split('');
      row[c] = row[c] === '#' ? '.' : '#';
      prevRows[r] = row.join('');
      font.glyphs[key] = prevRows;
    } else {
      const row = prevRows[r].split('');
      row[c] = row[c] === '+' ? '0' : '+';
      prevRows[r] = row.join('');
      font.glyphs[key] = codec.applyShadowRule(prevRows);
    }
    renderEditor();
    renderSpecimens();
  }

  undoBtn.addEventListener('click', () => {
    if (undoStack.length === 0) return;
    const item = undoStack.pop();
    fontData.fonts[item.fontId].glyphs[String(item.code)] = item.rows;
    currentFontId = item.fontId;
    currentCode = item.code;
    fontSelect.value = currentFontId;
    renderEditor();
    renderPicker();
    renderSpecimens();
  });

  fontSelect.addEventListener('change', () => {
    currentFontId = fontSelect.value;
    renderEditor();
    renderPicker();
  });

  liveInput.addEventListener('input', () => {
    renderTextToCanvas(liveCanvas, fontData.fonts[currentFontId], liveInput.value, 2);
  });

  document.getElementById('export-json').addEventListener('click', () => {
    const text = JSON.stringify(fontData, null, 2) + String.fromCharCode(10);
    downloadBytes('cnsw-fonts.json', new TextEncoder().encode(text), 'application/json');
    setStatus('Exported cnsw-fonts.json');
  });

  document.getElementById('import-json').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const text = await file.text();
    fontData = JSON.parse(text);
    undoStack.length = 0;
    renderEditor();
    renderPicker();
    renderSpecimens();
    setStatus('Imported ' + file.name);
    e.target.value = '';
  });

  document.getElementById('export-sans-hex').addEventListener('click', () => {
    const hex = codec.encodeHex(fontData.fonts.sans);
    downloadBytes('consciousnode-sans-8x8.hex', new TextEncoder().encode(hex), 'text/plain');
    setStatus('Exported consciousnode-sans-8x8.hex');
  });

  document.getElementById('export-serif-hex').addEventListener('click', () => {
    const hex = codec.encodeHex(fontData.fonts.serif);
    downloadBytes('cnsw-serif-8x16.hex', new TextEncoder().encode(hex), 'text/plain');
    setStatus('Exported cnsw-serif-8x16.hex');
  });

  document.getElementById('export-thes-asm').addEventListener('click', () => {
    const asm = codec.encodeTryteAsm(fontData.fonts.thesuramos);
    downloadBytes('times-new-thesuramos-9x9.tryte.asm', new TextEncoder().encode(asm), 'text/plain');
    setStatus('Exported times-new-thesuramos-9x9.tryte.asm');
  });

  function getTargets() {
    return [
      { font: fontData.fonts.sans, slug: 'consciousnode-sans', opts: { mode: 'ink', familyName: 'ConsciousNode Sans' } },
      { font: fontData.fonts.serif, slug: 'cnsw-serif', opts: { mode: 'ink', familyName: 'CNSW Serif' } },
      { font: fontData.fonts.thesuramos, slug: 'times-new-thesuramos', opts: { mode: 'ink', familyName: 'Times New Thesuramos' } },
      { font: fontData.fonts.thesuramos, slug: 'times-new-thesuramos-shadow', opts: { mode: 'shadow', familyName: 'Times New Thesuramos Shadow' } },
    ];
  }

  document.getElementById('export-all-ttf').addEventListener('click', () => {
    for (const t of getTargets()) {
      const ttf = codec.buildTTF(t.font, t.opts);
      downloadBytes(t.slug + '.ttf', ttf, 'font/ttf');
    }
    setStatus('Exported 4 .ttf files');
  });

  document.getElementById('export-all-woff').addEventListener('click', async () => {
    for (const t of getTargets()) {
      const ttf = codec.buildTTF(t.font, t.opts);
      const woff = await codec.buildWOFF(ttf, browserDeflate);
      downloadBytes(t.slug + '.woff', woff, 'font/woff');
    }
    setStatus('Exported 4 .woff files');
  });

  async function loadWoffFaces() {
    const loaded = [];
    for (const t of getTargets()) {
      const ttf = codec.buildTTF(t.font, t.opts);
      const woff = await codec.buildWOFF(ttf, browserDeflate);
      const face = new FontFace(t.opts.familyName, woff);
      await face.load();
      document.fonts.add(face);
      loaded.push(t.opts.familyName);
    }
    return loaded;
  }

  document.getElementById('verify-reader').addEventListener('click', async () => {
    const results = [];
    for (const t of getTargets()) {
      const ttf = codec.buildTTF(t.font, t.opts);
      const woff = await codec.buildWOFF(ttf, browserDeflate);
      const sfnt = await reader.decompressWoffToSfnt(woff, browserInflate);
      const parsed = reader.parseSfnt(sfnt);
      let diff = 0;
      for (let code = 32; code <= 126; code++) {
        const gid = parsed.cmapMap.get(code);
        const rast = reader.rasterizeGlyph(parsed.glyphs[gid].contours, t.font.width, t.font.height, t.font.pixelUnits, t.font.metrics.baselineRow);
        const orig = t.font.glyphs[String(code)];
        const target = t.opts.mode === 'shadow' ? '-' : (t.font.type === 'ternary' ? '+' : '#');
        for (let r = 0; r < t.font.height; r++) {
          for (let c = 0; c < t.font.width; c++) {
            if ((rast[r][c] === '#') !== (orig[r][c] === target)) diff++;
          }
        }
      }
      results.push(t.slug + ': ' + (parsed.checkSumAdjustmentValid && diff === 0 ? 'OK' : 'FAIL(' + diff + ')'));
    }
    setStatus('Independent reader check: ' + results.join(', '));
  });

  // Expose minimal test hooks on window for automated browser verification
  window.CNSWForge = {
    getJsonString: () => JSON.stringify(fontData, null, 2) + String.fromCharCode(10),
    importJsonString: (s) => {
      fontData = JSON.parse(s);
      undoStack.length = 0;
      renderEditor();
      renderPicker();
      renderSpecimens();
    },
    loadWoffFaces,
    buildWoffBytes: async () => {
      const out = {};
      for (const t of getTargets()) {
        const ttf = codec.buildTTF(t.font, t.opts);
        out[t.slug] = Array.from(await codec.buildWOFF(ttf, browserDeflate));
      }
      return out;
    },
  };

  renderEditor();
  renderPicker();
  renderSpecimens();
  loadWoffFaces()
    .then((names) => setStatus('Loaded WOFF FontFaces: ' + names.join(', ')))
    .catch((err) => setStatus('FontFace load error: ' + err.message));
})();
</script>
</body>
</html>
